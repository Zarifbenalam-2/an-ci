name: android-device

# Boots a hardware-accelerated Android emulator on a stock ubuntu-latest runner
# (4 vCPU / 16 GB, /dev/kvm exposed), drives your app with adbctl.py, and returns
# screenshots, a screen recording and logcat as build artifacts.
#
# Each stage is its own step so a failure names the phase that broke, and a
# diagnostics step commits what it can read back into the repo on failure, so
# failures are debuggable without logging in.

on:
  workflow_dispatch:
    inputs:
      package:
        description: App package to launch once the device is up
        required: false
        default: com.android.settings
      api-level:
        description: Android API level
        required: false
        default: "34"
  push:
    paths:
      - "android-headless/**"
      - ".github/workflows/android-device.yml"

permissions:
  contents: write  # only used by the failure-diagnostics step, which pushes a log

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The emulator needs read/write access to /dev/kvm. Without this rule it
      # silently falls back to software rendering and may never finish booting.
      - name: Make /dev/kvm accessible
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "WARNING: /dev/kvm is absent on this runner"

      # The emulator links against these at startup; a bare runner can be missing
      # some, which shows up as "error while loading shared libraries".
      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libpulse0 libnss3 libx11-6 libxcomposite1 libxcursor1 libxi6 \
            libxtst6 libgl1 libasound2t64 || \
          sudo apt-get install -y -qq \
            libpulse0 libnss3 libx11-6 libxcomposite1 libxcursor1 libxi6 \
            libxtst6 libgl1 libasound2

      - name: Install SDK and system image
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/clt.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o "$RUNNER_TEMP/clt.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
             "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install platform-tools emulator \
            "system-images;android-34;google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          # avdmanager and the emulator disagree about the default AVD directory.
          # Pin one explicitly so both look in the same place.
          mkdir -p "$RUNNER_TEMP/avd" "$RUNNER_TEMP/android-user"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Create AVD
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | avdmanager create avd -n headless \
            -k "system-images;android-34;google_apis;x86_64" \
            --device pixel_6 --force

          # If the tools ignored ANDROID_AVD_HOME, move the result into it.
          if [ ! -f "$ANDROID_AVD_HOME/headless.ini" ] && \
             [ -f "$ANDROID_USER_HOME/avd/headless.ini" ]; then
            cp -r "$ANDROID_USER_HOME/avd/." "$ANDROID_AVD_HOME/"
          fi

          echo "--- AVD home: $ANDROID_AVD_HOME ---"
          ls -la "$ANDROID_AVD_HOME"
          test -f "$ANDROID_AVD_HOME/headless.ini"
          echo "--- emulator sees: ---"
          emulator -list-avds

      # Boot and drive in a single step: no question about whether a background
      # process survives a step boundary, and every command lands in a log file
      # that the diagnostics step commits on failure.
      - name: Boot emulator and drive the device
        run: |
          log="$RUNNER_TEMP/device.log"
          : > "$log"
          set -Eeuo pipefail
          trap 'rc=$?; echo "!!! FAILED rc=$rc at line $LINENO" >>"$log"' ERR

          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          {
            echo "--- accel-check ---"; emulator -accel-check 2>&1 || true
            echo "--- emulator -list-avds ---"; emulator -list-avds 2>&1 || true
            echo "--- launching ---"
          } >>"$log" 2>&1

          nohup emulator -avd headless -no-window -no-audio -no-boot-anim \
            -no-snapshot-save -no-snapshot-load -no-metrics \
            -gpu swiftshader_indirect >>"$log" 2>&1 &
          emu_pid=$!
          echo "emulator pid=$emu_pid" >>"$log"

          sleep 20
          if ! kill -0 "$emu_pid" 2>/dev/null; then
            echo "emulator exited within 20s" >>"$log"
            cat "$log"; exit 1
          fi

          deadline=$((SECONDS + 420))
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "boot did not complete within 7 minutes" >>"$log"
              cat "$log"; exit 1
            fi
            sleep 5
          done

          for s in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb shell settings put global "$s" 0.0 >>"$log" 2>&1 || true
          done

          echo "--- adb devices ---" >>"$log"
          adb devices -l >>"$log" 2>&1
          adb shell getprop ro.build.version.release >>"$log" 2>&1

          out="android-headless/runs"
          mkdir -p "$out"

          adb logcat -c >>"$log" 2>&1 || true
          adb shell screenrecord --time-limit 120 --bit-rate 4M /sdcard/run.mp4 >>"$log" 2>&1 &
          sleep 2

          echo "+ adbctl size" >>"$log"
          python android-headless/adbctl.py size >>"$log" 2>&1

          echo "+ adbctl open" >>"$log"
          python android-headless/adbctl.py open "${{ inputs.package || 'com.android.settings' }}" >>"$log" 2>&1
          sleep 8

          echo "+ adbctl shot 01" >>"$log"
          python android-headless/adbctl.py shot "$out/01-launch.png" >>"$log" 2>&1

          # Example of scripted interaction: open the notification shade.
          echo "+ adbctl swipe" >>"$log"
          python android-headless/adbctl.py swipe 540 0 540 1400 --ms 250 >>"$log" 2>&1
          sleep 2

          echo "+ adbctl shot 02" >>"$log"
          python android-headless/adbctl.py shot "$out/02-shade.png" >>"$log" 2>&1

          adb shell pkill -INT screenrecord >>"$log" 2>&1 || true
          sleep 3
          adb pull /sdcard/run.mp4 "$out/run.mp4" >>"$log" 2>&1 || true
          adb logcat -d > "$out/logcat.txt" 2>&1 || true

          adb shell dumpsys window 2>/dev/null | grep -E 'mCurrentFocus|mFocusedApp' >>"$log" || true
          adb shell dumpsys activity activities 2>/dev/null | grep -m1 'ResumedActivity' >>"$log" || true

          echo "--- artifacts ---" >>"$log"; ls -la "$out" >>"$log"
          cat "$log"

      # Runs whether the job succeeded or failed, so every run leaves readable
      # evidence in the repo: what the device was showing, plus file sizes and
      # checksums for the captures. The default token can push because of
      # `permissions: contents: write` above.
      - name: Publish run evidence
        if: always()
        run: |
          file="diagnostics/run-${GITHUB_RUN_ID}.txt"
          mkdir -p "$(dirname "$file")"
          {
            echo "## android-device run $GITHUB_RUN_ID"
            echo "job status: ${{ job.status }}"
            date -u
            echo
            echo "### captured files"
            ls -la android-headless/runs/ 2>&1 || true
            echo
            echo "### checksums"
            md5sum android-headless/runs/* 2>&1 || true
            echo
            echo "### screenshot dimensions"
          } > "$file"

          python - >>"$file" 2>&1 <<'PY'
import glob, struct, os
found = False
for p in sorted(glob.glob('android-headless/runs/*.png')):
    found = True
    with open(p, 'rb') as fh:
        data = fh.read()
    w, h = struct.unpack('>II', data[16:24])
    print(f"{os.path.basename(p)}: {w}x{h}, {len(data):,} bytes")
if not found:
    print("(no screenshots captured)")
PY

          {
            echo
            echo "### device.log"
            tail -120 "$RUNNER_TEMP/device.log" 2>/dev/null || echo "(none)"
            echo
            echo "### disk"
            df -h / || true
          } >> "$file"

          echo "=== evidence ==="; cat "$file"
          git config user.email "ci@users.noreply.github.com"
          git config user.name  "android-ci"
          git add "$file"
          git commit -m "CI evidence for run $GITHUB_RUN_ID" || echo "nothing to commit"
          git push origin HEAD:main || echo "push of evidence failed"

      - name: Upload frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-frames
          path: android-headless/runs/
          if-no-files-found: ignore
          retention-days: 14
