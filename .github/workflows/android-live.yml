name: android-live

# Boots an Android emulator on a runner and puts it on YOUR OWN private network,
# so you can open a live, mouse-controllable window of it on your PC.
#
# Why a tunnel at all: the runner has no inbound network route, so nothing on
# your PC can reach the emulator directly. Tailscale gives the runner an address
# that only YOUR devices can reach, authenticated by your own tailnet. That
# matters because Actions logs are readable by anyone on a public repo -- so this
# design never depends on keeping a URL secret.
#
# Setup, once:
#   1. Free Tailscale account, and install the Tailscale app on your PC
#      (double-click Tailscale.cmd in this repo to do both).
#   2. Run THIS workflow, pasting an auth key into the "authkey" box.
#      No repo secret is involved: the key lives only for this one run, is
#      masked in the logs, and is stored nowhere. Generate keys at
#      https://login.tailscale.com/admin/settings/keys (reusable, ephemeral),
#      and revoke a key once you no longer need it.
#
# Then run this workflow. It prints a 100.x.y.z address. On your PC:
#
#   adb connect 100.x.y.z:5555
#   scrcpy -s 100.x.y.z:5555
#
# ...which gives you the live phone window. The portable adb and scrcpy that
# phone/launch.py downloads work for this; nothing needs installing system-wide.

on:
  workflow_dispatch:
    inputs:
      authkey:
        description: Tailscale auth key (reusable + ephemeral). Used for this run only.
        required: true
      minutes:
        description: How long to keep the phone online (max ~340)
        required: false
        default: "110"

permissions:
  contents: write   # the step pushes progress beacons into the repo

jobs:
  live:
    runs-on: ubuntu-latest
    # GitHub's hard ceiling is 360 minutes per job. Leave room for setup.
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      # No public-repo gate here, deliberately. The address this workflow prints
      # is a tailnet address: it is useless to anyone not joined to your tailnet,
      # so its secrecy is not what protects the device. The only secret is
      # TS_AUTHKEY, which lives in Actions secrets and is never printed. (The
      # tmate-based workflow is different -- there a URL *is* the password, which
      # is why that one is still gated.)

      - name: Make /dev/kvm accessible
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libpulse0 libnss3 libx11-6 libxcomposite1 libxcursor1 libxi6 \
            libxtst6 libgl1 libasound2t64 || \
          sudo apt-get install -y -qq \
            libpulse0 libnss3 libx11-6 libxcomposite1 libxcursor1 libxi6 \
            libxtst6 libgl1 libasound2

      - name: Install SDK and system image
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/clt.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o "$RUNNER_TEMP/clt.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install platform-tools emulator \
            "system-images;android-34;google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/avd" "$RUNNER_TEMP/android-user"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Create AVD
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | avdmanager create avd -n headless \
            -k "system-images;android-34;google_apis;x86_64" --device pixel_6 --force
          if [ ! -f "$ANDROID_AVD_HOME/headless.ini" ] && \
             [ -f "$ANDROID_USER_HOME/avd/headless.ini" ]; then
            cp -r "$ANDROID_USER_HOME/avd/." "$ANDROID_AVD_HOME/"
          fi
          test -f "$ANDROID_AVD_HOME/headless.ini"

      # Everything that must stay alive lives in this ONE step. A background
      # process does not reliably survive a step boundary on hosted runners, so
      # the tailnet, the emulator, the port relay and the hold-open loop are all
      # started here together.
      - name: Boot the phone and publish it on your tailnet
        env:
          TS_AUTHKEY: ${{ inputs.authkey }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          set -Eeuo pipefail
          # The key arrives as a dispatch input, so it is not a stored secret --
          # mask it before anything can print it.
          echo "::add-mask::$TS_AUTHKEY"
          log="$RUNNER_TEMP/live.log"
          : > "$log"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          # Progress beacon: this step's log is unavailable while it runs, so
          # milestones are pushed into the repo where they can be read any time.
          git config user.name  "an-ci bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .session
          echo "live run $GITHUB_RUN_ID started $(date -u +%H:%M:%SZ)" > .session/live-status.txt
          beacon() {
            git checkout -B session-push HEAD >/dev/null 2>&1 || true
            git add .session >/dev/null 2>&1 || true
            git -c commit.gpgsign=false commit -q -m "live beacon: $1" || true
            for a in 1 2 3; do
              git fetch -q origin main && git rebase -q origin/main \
                && git push -q origin HEAD:main && return 0
              sleep 3
            done
            return 0
          }
          fail() {
            # The key is masked by now, so the log tail is safe to print.
            # Wide enough to include the line above a usage block.
            tail -60 "$log" || true
            beacon "FAILED: $1"
            echo "!!! $1"
            exit 1
          }

          echo "--- joining the tailnet ---" | tee -a "$log"
          # install.sh failed with exit 2 on the new ubuntu-26.04 runner image,
          # so fall back to the static tarball, which cannot break on a release.
          if ! curl -fsSL https://tailscale.com/install.sh | sh >>"$log" 2>&1; then
            echo "install.sh failed; using the static tarball" >>"$log"
            ver=$(curl -fsSL https://pkgs.tailscale.com/stable/ \
              | grep -oE 'tailscale_[0-9]+\.[0-9]+\.[0-9]+_amd64\.tgz' | head -1 \
              | cut -d_ -f2) || fail "could not read the tailscale version list"
            curl -fsSL -o /tmp/ts.tgz \
              "https://pkgs.tailscale.com/stable/tailscale_${ver}_amd64.tgz" >>"$log" 2>&1 \
              || fail "tailscale download failed"
            tar -xzf /tmp/ts.tgz -C /tmp
            sudo /tmp/tailscale_${ver}/tailscaled --statedir=/tmp/ts-state >>"$log" 2>&1 &
            sleep 3
            tsbin="/tmp/tailscale_${ver}/tailscale"
          else
            tsbin=$(readlink -f "$(command -v tailscale)") || fail "no tailscale binary"
          fi
          # Newer tailscale releases drop or rename up-flags; try in decreasing
          # specificity so a removed flag cannot block joining the tailnet.
          sudo "$tsbin" up --authkey "$TS_AUTHKEY" --hostname android-phone \
            --ephemeral --timeout 60s >>"$log" 2>&1 \
          || sudo "$tsbin" up --authkey "$TS_AUTHKEY" --hostname android-phone \
            --ephemeral >>"$log" 2>&1 \
          || sudo "$tsbin" up --authkey "$TS_AUTHKEY" >>"$log" 2>&1 \
          || fail "tailscale up failed"
          tsip=$(sudo "$tsbin" ip -4 | head -1) || fail "no tailscale ip"
          echo "tailnet address: $tsip" | tee -a "$log"
          beacon "on the tailnet as android-phone at $tsip"

          echo "--- booting the emulator ---" | tee -a "$log"
          nohup emulator -avd headless -no-window -no-audio -no-boot-anim \
            -no-snapshot-save -no-snapshot-load -no-metrics \
            -gpu swiftshader_indirect >>"$log" 2>&1 &
          adb wait-for-device
          deadline=$((SECONDS + 420))
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "boot timed out"; tail -40 "$log"
              fail "boot timed out: $(tail -3 "$log" | tr '\n' ' ' | cut -c1-200)"
            fi
            sleep 3
          done
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb shell settings put global "$s" 0.0 >>"$log" 2>&1 || true
          done
          echo "booted android $(adb shell getprop ro.build.version.release | tr -d '\r')" | tee -a "$log"
          beacon "android booted at $tsip"

          echo "--- publishing the emulator's adb port on the tailnet ---" | tee -a "$log"
          # The emulator listens on the runner's localhost only, so relay it onto
          # the tailnet interface. Reachable by your devices, nobody else.
          # Time-boxed: an apt mirror stall must not eat the whole session.
          if timeout 180 sudo apt-get install -y -qq socat >>"$log" 2>&1; then
            nohup timeout 86400 socat TCP-LISTEN:5555,fork,reuseaddr,bind="$tsip" \
              TCP:127.0.0.1:5555 >>"$log" 2>&1 &
          fi
          sleep 5
          if ! ss -ltn 2>/dev/null | grep -q 5555; then
            # fallback: let tailscale itself forward the port, no socat needed
            sudo "$tsbin" serve --bg --tcp 5555 tcp://127.0.0.1:5555 >>"$log" 2>&1 \
              || beacon "port relay may have failed"
          fi
          ss -ltn 2>/dev/null | grep 5555 | tee -a "$log" || true
          beacon "adb port published at $tsip:5555"

          echo
          echo "=============================================================="
          echo "  PHONE IS LIVE for ${MINUTES} minutes."
          echo
          echo "  On your PC (Tailscale app running):"
          echo "      adb connect ${tsip}:5555"
          echo "      scrcpy -s ${tsip}:5555"
          echo
          echo "  Or with the portable tools this repo downloads:"
          echo "      python android-headless/phone/launch.py attach ${tsip}:5555"
          echo "=============================================================="
          echo

          end=$((SECONDS + MINUTES * 60))
          while [ "$SECONDS" -lt "$end" ]; do
            if ! kill -0 "$(pgrep -f 'qemu-system|emulator -avd' | head -1)" 2>/dev/null; then
              echo "emulator is gone; ending the session early"
              break
            fi
            sleep 30
          done
          echo "session window closed"
          # Do NOT dump live.log here: it captures the tailscale command line,
          # and on a public repo the log is world-readable.
          echo "device was reachable at ${tsip}:5555"
