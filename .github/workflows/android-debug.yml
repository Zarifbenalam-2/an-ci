name: android-debug

# Boots the Android emulator and opens an SSH session on the runner so you can
# inspect and drive the device live: tap it, read logcat, pull screenshots.
#
# Manual trigger, or push to the marker file ".trigger-debug" to start a
# session. The session address is printed in the Actions log; this repository
# is public, so treat it as public knowledge: the runner is a throwaway, its
# auto-generated token is read-only and dies with the job. Do not put anything
# on the device you would not show a stranger.
#
# Note on design: the emulator and the interactive session run in the SAME step.
# A background process does not reliably survive a step boundary on hosted
# runners, so booting in one step and opening the session in the next leaves you
# connected to a machine whose device has already been killed.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-debug.yml"
      - ".trigger-debug"

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the session address to .session/address.txt
    # Literal, not an expression: GitHub's workflow validator rejects a
    # ${{ }} value for timeout-minutes and marks the whole file invalid.
    timeout-minutes: 105

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Without this the emulator falls back to software rendering and takes
      # many minutes to boot, or never does.
      - name: Make /dev/kvm accessible
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "WARNING: /dev/kvm is absent on this runner"

      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libpulse0 libnss3 libx11-6 libxcomposite1 libxcursor1 libxi6 \
            libxtst6 libgl1 libasound2t64 || \
          sudo apt-get install -y -qq \
            libpulse0 libnss3 libx11-6 libxcomposite1 libxcursor1 libxi6 \
            libxtst6 libgl1 libasound2

      - name: Install SDK and system image
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/clt.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o "$RUNNER_TEMP/clt.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
             "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install platform-tools emulator \
            "system-images;android-34;google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          # avdmanager and the emulator disagree about the default AVD directory.
          mkdir -p "$RUNNER_TEMP/avd" "$RUNNER_TEMP/android-user"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Create AVD
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | avdmanager create avd -n headless \
            -k "system-images;android-34;google_apis;x86_64" \
            --device pixel_6 --force
          if [ ! -f "$ANDROID_AVD_HOME/headless.ini" ] && \
             [ -f "$ANDROID_USER_HOME/avd/headless.ini" ]; then
            cp -r "$ANDROID_USER_HOME/avd/." "$ANDROID_AVD_HOME/"
          fi
          test -f "$ANDROID_AVD_HOME/headless.ini"
          emulator -list-avds

      # Emulator and session in one step, so the device is still alive when you
      # arrive. tmate holds the step open and prints the ssh command to use.
      #
      # While connected you get a shell on the runner with the device attached:
      #   adb devices
      #   adb logcat *:E                        errors, streaming
      #   adb shell input tap 540 1200          tap the device
      #   adb shell input swipe 540 1600 540 600 300
      #   adb install -r /path/to/app.apk
      #
      # Seeing it from your PC -- a runner has no display, so stream frames out
      # over the same ssh connection, in a second terminal:
      #   ssh -T <session-address> "adb exec-out screencap -p" > frame.png
      # Loop that for a ~1fps viewer. For motion, record then stream the file:
      #   in-session:  adb shell screenrecord --time-limit 120 /data/local/tmp/r.mp4
      #   from your PC: ssh -T <session-address> "adb exec-out cat /data/local/tmp/r.mp4" > r.mp4
      - name: Boot the device and open the interactive session
        run: |
          log="$RUNNER_TEMP/session.log"
          : > "$log"
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          # Progress beacon: this step is opaque while it runs (the log API only
          # serves finished jobs), so every milestone is pushed into the repo,
          # where it is readable without authentication. Best effort: a failed
          # push must never fail the session.
          git config user.name  "an-ci bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .session
          echo "run $GITHUB_RUN_ID started $(date -u +%H:%M:%SZ)" > .session/status.txt
          beacon() {
            git checkout -B session-push HEAD >/dev/null 2>&1 || true
            git add .session >/dev/null 2>&1 || true
            git -c commit.gpgsign=false commit -q -m "session beacon: $1" || true
            for a in 1 2 3; do
              git fetch -q origin main && git rebase -q origin/main \
                && git push -q origin HEAD:main && return 0
              sleep 3
            done
            return 0
          }
          fail() { beacon "FAILED: $1"; echo "!!! $1"; exit 1; }

          # No apt here: apt-get install tmate hung for 18 minutes on one run
          # (stuck lock / stalled mirror), which is a silly way to lose a job.
          # tmate ships a static binary; fetching it cannot hang on dpkg.
          beacon "fetching tmate"
          mkdir -p "$RUNNER_TEMP/bin"
          if ! timeout 180 curl -fsSL -o "$RUNNER_TEMP/tmate.tar.xz" \
              https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-static-linux-amd64.tar.xz; then
            fail "could not download the tmate binary"
          fi
          tar -xJf "$RUNNER_TEMP/tmate.tar.xz" -C "$RUNNER_TEMP/bin" --strip-components=1
          export PATH="$RUNNER_TEMP/bin:$PATH"
          tmate -V || fail "tmate binary is not runnable"
          # tmate needs a key of its own to reach the relay.
          [ -f "$HOME/.ssh/id_rsa" ] || ssh-keygen -t rsa -b 4096 -N "" -f "$HOME/.ssh/id_rsa" -q
          beacon "tmate ready"

          nohup emulator -avd headless -no-window -no-audio -no-boot-anim \
            -no-snapshot-save -no-snapshot-load -no-metrics \
            -gpu swiftshader_indirect >>"$log" 2>&1 &
          adb wait-for-device
          beacon "emulator process started"

          deadline=$((SECONDS + 420))
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "boot timed out" >>"$log"; cat "$log"
              beacon "boot timed out: $(tail -3 "$log" | tr '\n' ' ' | cut -c1-200)"
              exit 1
            fi
            sleep 3
          done
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb shell settings put global "$s" 0.0 >>"$log" 2>&1 || true
          done
          adb devices -l >>"$log" 2>&1
          beacon "android booted, opening tmate session"

          echo "device is up -- opening the interactive session below"
          cat "$log"
          echo "-------------------------------------------------------------"
          echo "Session address is printed by tmate next. Keep it secret."
          echo
          echo "Two ways to use it from your PC:"
          echo
          echo "  A) A shell on the runner (tap it with adb commands):"
          echo "       ssh <session-address>"
          echo
          echo "  B) A LIVE WINDOW, with nothing installed on your PC."
          echo "     ssh can forward the device's port to your machine:"
          echo "       ssh -N -L 5555:localhost:5555 <session-address>   # leave this open"
          echo "       # then, in a second window, using the portable tools:"
          echo "       adb connect localhost:5555"
          echo "       scrcpy -s localhost:5555"
          echo "     (port forwarding over the tmate session is untested; if it is"
          echo "      refused, option A always works.)"
          echo "-------------------------------------------------------------"

          tmate_log="$RUNNER_TEMP/tmate.log"
          tmate -F >"$tmate_log" 2>&1 &
          tmate_pid=$!
          addr=""
          for i in $(seq 1 60); do
            addr=$(grep -m1 -oE 'ssh [-A-Za-z0-9]+@[a-z0-9.-]+\.tmate\.(io|me)' "$tmate_log" || true)
            if [ -n "$addr" ]; then break; fi
            sleep 2
          done
          if [ -n "$addr" ]; then
            echo "$addr" > .session/address.txt
            beacon "tmate up: $addr"
          else
            # push what tmate actually printed so the outside can diagnose it
            cp "$tmate_log" .session/tmate.log 2>/dev/null || true
            beacon "no tmate address in 120s: $(tail -2 "$tmate_log" | tr '\n' ' ' | cut -c1-200)"
          fi
          wait $tmate_pid

      - name: Upload session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-log
          path: ${{ runner.temp }}/session.log
          if-no-files-found: warn
