name: android-demo

# Can this emulator behave like a usable phone? Installs a real app, puts a video
# on the device, plays it, and then opens the YouTube app on a real video --
# capturing what the screen actually showed at each step.
#
# Evidence lands in diagnostics/ so it is readable without logging in.
# Path-filtered so it only runs when the demo itself changes.

on:
  workflow_dispatch:
  push:
    paths:
      - "android-headless/demo/**"
      - ".github/workflows/android-demo.yml"

permissions:
  contents: write  # the evidence step commits its report

env:
  VIDEO_URL: "https://www.youtube.com/watch?v=aqz-KE-bpKQ"

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make /dev/kvm accessible
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libpulse0 libnss3 libx11-6 libxcomposite1 libxcursor1 libxi6 \
            libxtst6 libgl1 libasound2t64 || \
          sudo apt-get install -y -qq \
            libpulse0 libnss3 libx11-6 libxcomposite1 libxcursor1 libxi6 \
            libxtst6 libgl1 libasound2

      - name: Install SDK and system image
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/clt.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o "$RUNNER_TEMP/clt.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install platform-tools emulator \
            "system-images;android-34;google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/avd" "$RUNNER_TEMP/android-user"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Create AVD
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | avdmanager create avd -n headless \
            -k "system-images;android-34;google_apis;x86_64" --device pixel_6 --force
          if [ ! -f "$ANDROID_AVD_HOME/headless.ini" ] && \
             [ -f "$ANDROID_USER_HOME/avd/headless.ini" ]; then
            cp -r "$ANDROID_USER_HOME/avd/." "$ANDROID_AVD_HOME/"
          fi
          test -f "$ANDROID_AVD_HOME/headless.ini"

      - name: Boot and run the demo
        run: |
          log="$RUNNER_TEMP/demo.log"
          : > "$log"
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          out="android-headless/demo/out"
          mkdir -p "$out"

          say() { printf '\n=== %s ===\n' "$*" >>"$log"; }
          # Emulator output goes to its own file so demo.log stays readable.
          nohup emulator -avd headless -no-window -no-audio -no-boot-anim \
            -no-snapshot-save -no-snapshot-load -no-metrics \
            -gpu swiftshader_indirect >"$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          deadline=$((SECONDS + 420))
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            [ "$SECONDS" -ge "$deadline" ] && { echo "boot timeout" >>"$log"; exit 1; }
            sleep 3
          done
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb shell settings put global "$s" 0.0 >>"$log" 2>&1 || true
          done
          # A sleeping or locked screen screenshots as a near-blank frame, which
          # would look like the apps failed to render when they did not.
          adb shell input keyevent 224 >>"$log" 2>&1 || true   # KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard >>"$log" 2>&1 || true
          sleep 2
          echo "booted android $(adb shell getprop ro.build.version.release | tr -d '\r')" >>"$log"

          say "A: media apps already in this image"
          adb shell pm list packages 2>/dev/null \
            | grep -Ei 'youtube|chrome|gallery|photo|media|vlc' >>"$log" 2>&1 || true

          say "B: put a real video on the device"
          say "B0: what /sdcard looks like on this image"
          adb shell ls -la /sdcard >>"$log" 2>&1 || true
          adb shell mount 2>/dev/null | grep -iE 'sdcard|fuse|emulated' >>"$log" 2>&1 || true
          adb shell mkdir -p /sdcard/Download >>"$log" 2>&1 || true
          # Push to an explicit file path: a bare directory path with a trailing
          # slash makes adb try to create the directory as a file.
          vid=""
          for dest in /sdcard/Download/test-video.mp4 \
                      /sdcard/Movies/test-video.mp4 \
                      /data/local/tmp/test-video.mp4; do
            if adb push android-headless/demo/test-video.mp4 "$dest" >>"$log" 2>&1; then
              vid="$dest"; echo "pushed to $vid" >>"$log"; break
            fi
          done
          [ -n "$vid" ] || echo "!! could not place the video" >>"$log"

          say "C: install VLC from F-Droid"
          meta=$(curl -fsS --max-time 30 https://f-droid.org/api/v1/packages/org.videolan.vlc || true)
          vlc_ok=no
          for code in $(printf '%s' "$meta" \
                        | grep -o '"versionCode":[0-9]*' | cut -d: -f2 | head -3); do
            url="https://f-droid.org/repo/org.videolan.vlc_${code}.apk"
            echo "trying ${url##*/}" >>"$log"
            if curl -fsS --max-time 150 -o "$RUNNER_TEMP/vlc.apk" "$url" 2>>"$log" \
               && adb install -r "$RUNNER_TEMP/vlc.apk" >>"$log" 2>&1; then
              vlc_ok=yes; echo "installed versionCode=$code" >>"$log"; break
            fi
          done

          if [ "$vlc_ok" = yes ] && [ -n "$vid" ]; then
            say "D: play the local video in VLC"
            # -p binds to VLC; without it Android shows an app-chooser dialog
            # (ResolverActivity) and nothing ever plays.
            adb shell am start -W -p org.videolan.vlc \
              -a android.intent.action.VIEW -d "file://$vid" -t video/mp4 >>"$log" 2>&1 || true
            sleep 12
            adb exec-out screencap -p > "$out/01-vlc-local-video.png" 2>>"$log" || true
            adb shell dumpsys activity activities 2>/dev/null \
              | grep -m2 'topResumedActivity' >>"$log" 2>&1 || true
            adb shell dumpsys media_session 2>/dev/null | grep -m4 'state=' >>"$log" 2>&1 || true
          else
            echo "skipped VLC playback (vlc_ok=$vlc_ok vid=$vid)" >>"$log"
          fi

          say "E0: clear the way for the YouTube app"
          # A permission dialog was covering YouTube, the notification shade left
          # over from the swipe was covering the screen, and Chrome's first-run
          # page kept grabbing focus. Deal with all three.
          adb shell cmd statusbar collapse >>"$log" 2>&1 || true
          adb shell pm grant com.google.android.youtube android.permission.POST_NOTIFICATIONS \
            >>"$log" 2>&1 || true
          adb shell am force-stop com.android.chrome >>"$log" 2>&1 || true
          adb shell am force-stop com.google.android.apps.youtube.music >>"$log" 2>&1 || true
          sleep 3

          say "E: open a real video in the YouTube app"
          # Bind the URL to YouTube specifically (-p). Without it, Android gives
          # http(s) links to Chrome, which then sits on its first-run consent
          # page and never loads the page.
          adb shell am start -W -p com.google.android.youtube \
            -a android.intent.action.VIEW -d "$VIDEO_URL" >>"$log" 2>&1 || true
          sleep 20
          adb exec-out screencap -p > "$out/02-youtube-app.png" 2>>"$log" || true
          adb shell dumpsys window 2>/dev/null \
            | grep -m1 'mCurrentFocus' >>"$log" 2>&1 || true
          adb shell dumpsys activity activities 2>/dev/null \
            | grep -m2 'topResumedActivity' >>"$log" 2>&1 || true
          adb shell dumpsys media_session 2>/dev/null | grep -m4 'state=' >>"$log" 2>&1 || true
          say "E2: any YouTube complaints in logcat"
          adb logcat -d 2>/dev/null | grep -iE 'youtube|WatchWhile|GmsClient' \
            | tail -15 >>"$log" 2>&1 || true

          say "F: same URL in Chrome (fallback path)"
          adb shell am start -W -n com.android.chrome/com.google.android.apps.chrome.Main \
            -a android.intent.action.VIEW -d "$VIDEO_URL" >>"$log" 2>&1 || true
          sleep 18
          adb exec-out screencap -p > "$out/03-chrome-youtube.png" 2>>"$log" || true
          adb shell dumpsys activity activities 2>/dev/null \
            | grep -m2 'topResumedActivity' >>"$log" 2>&1 || true

          say "G: decoder activity"
          adb logcat -d 2>/dev/null \
            | grep -Ei 'c2\.(goldfish|android)\.(avc|hevc|vp9|av1)|MediaCodec.*create|VideoDecoder' \
            | tail -20 >>"$log" 2>&1 || true

          say "H: captured files"
          ls -la "$out" >>"$log" 2>&1 || true
          cat "$log"

      - name: Publish demo evidence
        if: always()
        run: |
          file="diagnostics/demo-${GITHUB_RUN_ID}.txt"
          mkdir -p "$(dirname "$file")"
          {
            echo "## android-demo run $GITHUB_RUN_ID"
            echo "job status: ${{ job.status }}"
            date -u
            echo
            echo "### captured files"
            ls -la android-headless/demo/out/ 2>&1 || true
            echo
            echo "### checksums"
            md5sum android-headless/demo/out/* 2>&1 || true
            echo
            echo "### screenshot dimensions"
          } > "$file"
          file android-headless/demo/out/*.png >>"$file" 2>&1 || echo "(no screenshots)" >>"$file"
          {
            echo
            echo "### demo.log"
            cat "$RUNNER_TEMP/demo.log" 2>/dev/null || echo "(none)"
            echo
            echo "### emulator.log (tail)"
            tail -20 "$RUNNER_TEMP/emulator.log" 2>/dev/null || echo "(none)"
          } >> "$file"
          echo "=== evidence ==="; cat "$file"
          git config user.email "ci@users.noreply.github.com"
          git config user.name  "android-ci"
          # Copy the captures somewhere git does not ignore, then commit them, so the
          # screenshots are viewable straight from the repo.
          dest="diagnostics/captures/${GITHUB_RUN_ID}"
          mkdir -p "$dest"
          cp android-headless/demo/out/*.png "$dest/" 2>/dev/null || true
          git add "$file" "$dest" 2>/dev/null || git add "$file"
          git commit -m "CI demo evidence for run $GITHUB_RUN_ID" || echo "nothing to commit"
          # Two workflows can fire on one push and race for main, so retry with a
          # rebase instead of silently losing the report.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin main && git push -q origin HEAD:main; then
              echo "evidence pushed (attempt $attempt)"; exit 0
            fi
            echo "push attempt $attempt failed; retrying"; sleep 5
          done
          echo "could not push evidence after 5 attempts"

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-captures
          path: android-headless/demo/out/
          if-no-files-found: ignore
          retention-days: 14
